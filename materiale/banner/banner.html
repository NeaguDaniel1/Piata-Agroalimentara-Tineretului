<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Banner Piața Tineretului — 4200 × 1000 mm</title>
<!--
  Banner pentru tipar: 4,2 m × 1 m (dimensiune reală, 1:1).
  Toate măsurile sunt în milimetri. Textele importante stau la cel puțin
  80 mm de margine, ca să nu fie atinse de tiv sau de capse.
  Variante cu săgeată: ?sageata=stanga sau ?sageata=dreapta în adresă
  (la „dreapta” bannerul e oglindit, ca săgeata să fie la marginea din dreapta).
  PDF-ul se generează cu scriptul genereaza.js din același folder.
-->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<style>
  @page { size: 4200mm 1000mm; margin: 0; }
  :root {
    --green: #1e5a3c;
    --green-dark: #16241b;
    --cream: #f6f5f1;
    --ink: #16201a;
    --muted: #4f5a52;
    --accent: #d9472b;
    --mustard: #e9b44c;
    --yellow: #f3c43c;

    /* culorile variantei (tema implicită: verde) */
    --left-bg: var(--green); --left-ink: #fff; --hl: var(--yellow);
    --right-bg: var(--cream); --right-ink: var(--ink); --right-muted: var(--muted);
    --rule: #d4d1c5; --rule-strong: var(--ink);
    --stripe: var(--accent); --circle: var(--yellow); --arrow-ink: var(--green); --pin: var(--accent);
  }
  /* Variante de culori: ?tema=alb | galben | inchis */
  .banner[data-tema="alb"] {
    --left-bg: #f6f5f1; --left-ink: #16241b; --hl: #d9472b;
    --right-bg: #1e5a3c; --right-ink: #fff; --right-muted: rgba(255,255,255,.75);
    --rule: rgba(255,255,255,.25); --rule-strong: #fff;
    --stripe: #f3c43c; --circle: #1e5a3c; --arrow-ink: #fff; --pin: #f3c43c;
  }
  .banner[data-tema="galben"] {
    --left-bg: #f3c43c; --left-ink: #16241b; --hl: #b8321f;
    --right-bg: #16241b; --right-ink: #fff; --right-muted: rgba(255,255,255,.75);
    --rule: rgba(255,255,255,.22); --rule-strong: #f3c43c;
    --stripe: #b8321f; --circle: #16241b; --arrow-ink: #f3c43c; --pin: #f3c43c;
  }
  .banner[data-tema="inchis"] {
    --left-bg: #16241b; --left-ink: #fff; --hl: #f3c43c;
    --right-bg: #1e5a3c; --right-ink: #fff; --right-muted: rgba(255,255,255,.75);
    --rule: rgba(255,255,255,.22); --rule-strong: #f3c43c;
    --stripe: #f3c43c; --circle: #f3c43c; --arrow-ink: #16241b; --pin: #f3c43c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 4200mm; height: 1000mm; }
  body { font-family: "Geist", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .banner { position: relative; width: 4200mm; height: 1000mm; overflow: hidden; display: flex; }

  /* ---------- Partea stângă: numele pieței ---------- */
  .left {
    position: relative; flex: 1; min-width: 0; height: 100%; /* min-width: 0 = panoul nu se lărgește după text */
    background: var(--left-bg); color: var(--left-ink);
    padding: 95mm 120mm 95mm 150mm;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Textul mare, pe trei rânduri, care umplu tot panoul verde:
       sus:      „S-a deschis Piața” — galben, gros, pe toată lățimea (să sară în ochi)
       mijloc:   „Agroalimentară”    — alb
       jos:      „Tineretului”       — alb, aceeași mărime cu rândul din mijloc
     Mărimile se calculează automat (scriptul de jos) ca textul să umple lățimea și înălțimea. */
  .name {
    font: 600 230mm/0.8 "Bricolage Grotesque", sans-serif;
    margin-left: -0.03em;
  }
  .name span { display: block; white-space: nowrap; letter-spacing: -0.03em; }
  .name .y { font-weight: 700; color: var(--hl); }
  .name .l2 { margin-top: 0.1em; }  /* loc pentru căciula lui Ă */
  .name .l3 { margin-top: 0.14em; } /* loc pentru coada lui g */

  .cats {
    display: flex; align-items: center; gap: 42mm;
    font: 500 64mm/1 "Geist", sans-serif; color: rgba(255, 255, 255, .9);
    white-space: nowrap;
  }
  .cats i { width: 22mm; height: 22mm; border-radius: 50%; background: var(--mustard); display: block; }

  /* ---------- Separator ---------- */
  .stripe { width: 46mm; height: 100%; background: var(--stripe); flex: none; }

  /* ---------- Partea dreaptă: program și adresă ---------- */
  .right {
    flex: none; width: 950mm; height: 100%;
    background: var(--right-bg); color: var(--right-ink);
    padding: 95mm 90mm 95mm 100mm;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .right h2 { font: 600 108mm/0.86 "Bricolage Grotesque", sans-serif; letter-spacing: -3mm; margin-bottom: 26mm; }

  .hours { width: 100%; border-collapse: collapse; font: 500 48mm/1 "Geist", sans-serif; }
  .hours td { padding: 11mm 0; border-top: 2.5mm solid var(--rule); }
  .hours tr:first-child td { border-top: 4mm solid var(--rule-strong); }
  .hours td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  .address {
    display: flex; align-items: center; gap: 20mm;
    font: 600 52mm/1.1 "Geist", sans-serif;
  }
  .address svg { width: 64mm; height: 64mm; flex: none; }
  .address small { display: block; font-weight: 400; color: var(--right-muted); font-size: 41mm; margin-top: 8mm; }
  .address svg path { fill: var(--pin); }
  .address svg circle { fill: var(--right-bg); }

  /* ---------- Săgeata în cerc (doar în variantele cu săgeată) ---------- */
  .arrow { display: none; position: absolute; top: 240mm; width: 520mm; height: 520mm; }
  .arrow circle { fill: var(--circle); }
  .arrow path { fill: none; stroke: var(--arrow-ink); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }

  .has-arrow .arrow { display: block; }
  .has-arrow .cats { font-size: 66mm; gap: 34mm; }
  .has-arrow .cats i { width: 20mm; height: 20mm; }

  .arrow-left .left { padding-left: 770mm; }
  .arrow-left .arrow { left: 140mm; }
  .arrow-right .left { padding-right: 770mm; }

  .arrow-right { flex-direction: row-reverse; }
  .arrow-right .arrow { right: 140mm; }
  .arrow-right .arrow svg { transform: scaleX(-1); }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <section class="left">
      <div class="arrow"><svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
        <circle cx="100" cy="100" r="100"/>
        <path d="M140 100 H62 M98 62 L60 100 L98 138"/>
      </svg></div>
      <h1 class="name"><span class="l1 y">S-a deschis Piața</span><span class="l2">Agroalimentară</span><span class="l3">Tineretului</span></h1>
    </section>

    <div class="stripe"></div>

    <section class="right">
      <div class="sched">
      <h2>Deschis zilnic</h2>
      <table class="hours">
        <tr><td>Luni</td><td>06:00 – 20:00</td></tr>
        <tr><td>Marți</td><td>06:00 – 20:00</td></tr>
        <tr><td>Miercuri</td><td>06:00 – 20:00</td></tr>
        <tr><td>Joi</td><td>06:00 – 20:00</td></tr>
        <tr><td>Vineri</td><td>06:00 – 20:00</td></tr>
        <tr><td>Sâmbătă</td><td>06:00 – 18:00</td></tr>
        <tr><td>Duminică</td><td>07:00 – 14:00</td></tr>
      </table>
      </div>
      <p class="address">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" fill="#d9472b"/><circle cx="12" cy="10" r="2.6" fill="#f6f5f1"/></svg>
        <span>Str. Tineretului 30<small>Dudu, Chiajna · parcare gratuită</small></span>
      </p>
    </section>
  </div>

<script>
(async function () {
  var dir = new URLSearchParams(location.search).get("sageata");
  var b = document.getElementById("banner");
  var tema = new URLSearchParams(location.search).get("tema");
  if (tema) b.setAttribute("data-tema", tema);
  if (dir === "stanga") b.classList.add("has-arrow", "arrow-left");
  if (dir === "dreapta") b.classList.add("has-arrow", "arrow-right");
  await document.fonts.load('600 100px "Bricolage Grotesque"', "ȚȘĂ");
  await document.fonts.load('700 100px "Bricolage Grotesque"', "ȚȘĂ");
  await document.fonts.ready;

  // Textul mare umple lățimea și înălțimea panoului verde
  var left = document.querySelector(".left"), name = document.querySelector(".name");
  var l1 = name.querySelector(".l1"), l2 = name.querySelector(".l2"), l3 = name.querySelector(".l3");
  var cs = getComputedStyle(left);
  var availW = left.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  var bottomLimit = left.getBoundingClientRect().bottom - parseFloat(cs.paddingBottom);
  function textWidth(sp) { var r = document.createRange(); r.selectNodeContents(sp); return r.getBoundingClientRect().width; }
  function fs(el) { return parseFloat(getComputedStyle(el).fontSize); }

  // 1) „S-a deschis Piața” cât toată lățimea
  var s1 = fs(l1) * availW / textWidth(l1);
  // 2) „Agroalimentară” și „Tineretului”: aceeași mărime, cel mult cât încape pe lățime
  var s23max = fs(l2) * availW / Math.max(textWidth(l2), textWidth(l3));
  var s23 = s23max;
  function apply() { l1.style.fontSize = s1 + "px"; l2.style.fontSize = s23 + "px"; l3.style.fontSize = s23 + "px"; }
  apply();

  // 3) Aliniere: vârful literelor din primul rând la același nivel cu „Deschis zilnic”
  var ctx = document.createElement("canvas").getContext("2d");
  function capTop(el) {
    var st = getComputedStyle(el), size = parseFloat(st.fontSize);
    ctx.font = st.fontWeight + " " + size + 'px "Bricolage Grotesque"';
    var m = ctx.measureText("H");
    var line = el.firstElementChild || el, r = document.createRange(); r.selectNodeContents(line);
    return r.getClientRects()[0].top + m.fontBoundingBoxAscent - m.actualBoundingBoxAscent;
  }
  function align() { name.style.marginTop = "0px"; name.style.marginTop = (capTop(document.querySelector(".right h2")) - capTop(l1)) + "px"; }

  // 4) Rândurile 2–3 se potrivesc ca ultimul rând să ajungă exact la marginea de jos
  //    (dacă nici așa nu încape, se micșorează și primul rând)
  // baza literelor din „Tineretului” (cuvântul nu are litere care coboară sub rând)
  function baseline(el) {
    var st = getComputedStyle(el);
    ctx.font = st.fontWeight + " " + st.fontSize + ' "Bricolage Grotesque"';
    var r = document.createRange(); r.selectNodeContents(el);
    return r.getClientRects()[0].bottom - ctx.measureText("H").fontBoundingBoxDescent;
  }
  for (var i = 0; i < 12; i++) {
    apply(); align();
    var gap = bottomLimit - baseline(l3);
    if (Math.abs(gap) < 1) break;
    var per = (name.getBoundingClientRect().height) / (s1 * 0.8 + s23 * 1.84); // px de înălțime per px de font
    var next = s23 + gap / (1.84 * per);
    if (next > s23max) { s23 = s23max; apply(); align(); break; }
    if (next < s1 * 0.55) { s1 *= 0.95; s23 = Math.min(s23max, s23); continue; }
    s23 = next;
  }

  window.__gata = true;
})();
</script>
</body>
</html>
