<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Banner deschidere — 4200 × 1000 mm</title>
<!--
  Banner „S-a deschis Piața Tineretului”, 4,2 m × 1 m, la dimensiune reală (1:1, măsuri în mm).
  Săgeata e implicit în stânga; cu ?sageata=dreapta în adresă se mută în dreapta.
  Rândul mare („Piața Tineretului”) își calculează singur mărimea ca să umple exact lățimea.
  PDF-ul se generează cu: node materiale/banner/genereaza.js
-->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@500;600&display=block" rel="stylesheet">
<style>
  @page { size: 4200mm 1000mm; margin: 0; }
  :root {
    --green: #1e5a3c;
    --green-light: #23613f;
    --yellow: #f3c43c;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 4200mm; height: 1000mm; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--green); }

  .banner { position: relative; width: 4200mm; height: 1000mm; overflow: hidden; background: var(--green); color: var(--white); }

  /* frunza din logo, mare, ca element de fundal (tăiată de margine) */
  .watermark { position: absolute; top: -230mm; right: -330mm; width: 1500mm; height: 1500mm; }
  .watermark path { fill: none; stroke: var(--green-light); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* săgeata în cerc */
  .arrow { position: absolute; top: 140mm; left: 150mm; width: 720mm; height: 720mm; }
  .arrow circle { fill: var(--yellow); }
  .arrow path { fill: none; stroke: var(--green); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }

  /* textul */
  .text {
    position: absolute; top: 0; bottom: 0; left: 1040mm; right: 160mm;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font: 600 175mm/1 "Bricolage Grotesque", sans-serif; letter-spacing: -4mm;
    color: var(--yellow);
    margin-bottom: 30mm;
  }
  .name {
    font: 600 330mm/0.9 "Bricolage Grotesque", sans-serif; letter-spacing: -10mm;
    white-space: nowrap;
    margin-left: -10mm;
  }
  .meta {
    margin-top: 72mm;
    display: flex; align-items: center; gap: 36mm;
    font: 500 66mm/1 "Geist", sans-serif; color: rgba(255, 255, 255, .88);
    white-space: nowrap;
  }
  .meta b { font-weight: 600; color: var(--white); letter-spacing: 7mm; }
  .meta i { width: 16mm; height: 16mm; border-radius: 50%; background: var(--yellow); display: block; flex: none; }

  /* varianta cu săgeata în dreapta */
  .right .arrow { left: auto; right: 150mm; }
  .right .arrow svg { transform: scaleX(-1); }
  .right .text { left: 160mm; right: 1040mm; }
  .right .watermark { right: auto; left: -330mm; transform: scaleX(-1); }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <svg class="watermark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 23c0-8.3 5.7-14 14-14 0 8.3-5.7 14-14 14Z"/><path d="M9 23l8-8"/></svg>

    <div class="arrow"><svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
      <circle cx="100" cy="100" r="100"/>
      <path d="M140 100 H62 M98 62 L60 100 L98 138"/>
    </svg></div>

    <div class="text">
      <p class="kicker">S-a deschis</p>
      <h1 class="name" id="name">Piața Tineretului</h1>
      <p class="meta"><b>AGROALIMENTARĂ</b><i></i>Producători locali<i></i>Str. Tineretului 30, Dudu</p>
    </div>
  </div>

<script>
(async function () {
  if (new URLSearchParams(location.search).get("sageata") === "dreapta") document.getElementById("banner").classList.add("right");
  await document.fonts.load('600 100px "Bricolage Grotesque"', "ȚȘĂ");
  await document.fonts.load('500 100px "Geist"', "ȚȘĂ");
  await document.fonts.ready;

  // „Piața Tineretului” umple exact lățimea zonei de text
  var name = document.getElementById("name"), box = name.parentElement;
  var target = box.clientWidth;
  var r = document.createRange(); r.selectNodeContents(name);
  var size = parseFloat(getComputedStyle(name).fontSize);
  var ls = parseFloat(getComputedStyle(name).letterSpacing) / size;
  var w = r.getBoundingClientRect().width;
  size = size * target / w;
  name.style.fontSize = size + "px";
  name.style.letterSpacing = ls * size + "px";

  // rândul de jos nu are voie să fie mai lat decât numele
  var meta = document.querySelector(".meta"), rm = document.createRange(); rm.selectNodeContents(meta);
  var mw = rm.getBoundingClientRect().width;
  if (mw > target) meta.style.fontSize = parseFloat(getComputedStyle(meta).fontSize) * target / mw + "px";

  window.__gata = true;
})();
</script>
</body>
</html>
