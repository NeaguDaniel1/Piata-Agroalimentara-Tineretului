<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Banner deschidere — 4200 × 1000 / 1200 mm</title>
<!--
  Banner „S-a deschis piața”, 4,2 m lungime, la dimensiune reală (1 unitate = 1 mm).
  Înălțimea implicită e 1 m; cu ?inaltime=1200 devine 1,2 m (săgeata crește, pastila e mai înaltă).
  Săgeata e implicit în stânga; cu ?sageata=dreapta în adresă se mută în dreapta.
  Dimensiunea textelor se calculează automat ca să umple exact spațiul.
  PDF-ul se generează cu: node materiale/banner/genereaza.js
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Paytone+One&display=block" rel="stylesheet">
<style>
  @page { size: 4200mm 1000mm; margin: 0; }
  * { margin: 0; padding: 0; }
  html, body { width: 4200mm; height: 1000mm; background: #fff; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  svg { display: block; width: 4200mm; height: 1000mm; }
</style>
</head>
<body>
<svg id="b" viewBox="0 0 4200 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45c93a"/>
      <stop offset=".55" stop-color="#1f9e2a"/>
      <stop offset="1" stop-color="#0f7a1f"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17782a"/>
      <stop offset="1" stop-color="#0a5219"/>
    </linearGradient>
  </defs>

  <!-- fundal și chenar -->
  <rect id="bg" width="4200" height="1000" fill="#ffffff"/>
  <rect id="frame" x="48" y="48" width="4104" height="904" fill="none" stroke="#0e6420" stroke-width="30"/>

  <!-- săgeata + liniuțele decorative (se oglindesc pentru varianta dreapta) -->
  <g id="arrowSide">
    <g id="arrow">
      <path id="arrowPath" d="M160 500 L660 125 L660 330 L1010 330 L1010 670 L660 670 L660 875 Z"/>
    </g>
    <g stroke-linecap="round" fill="none">
      <g id="leftTop">
      <!-- stânga sus -->
      <line x1="150" y1="175" x2="330" y2="275" stroke="#ffd60a" stroke-width="30"/>
      <line x1="120" y1="290" x2="300" y2="330" stroke="#139a29" stroke-width="30"/>
      <line x1="230" y1="125" x2="380" y2="215" stroke="#139a29" stroke-width="22"/>
      </g>
      <g id="leftBottom">
      <!-- stânga jos -->
      <line x1="150" y1="825" x2="330" y2="725" stroke="#ffd60a" stroke-width="30"/>
      <line x1="120" y1="710" x2="300" y2="670" stroke="#139a29" stroke-width="30"/>
      <line x1="230" y1="875" x2="380" y2="785" stroke="#139a29" stroke-width="22"/>
      </g>
    </g>
  </g>

  <g id="farSide" stroke-linecap="round" fill="none">
    <!-- dreapta sus -->
    <line x1="4060" y1="130" x2="3955" y2="235" stroke="#ffd60a" stroke-width="30"/>
    <line x1="4085" y1="275" x2="3965" y2="320" stroke="#139a29" stroke-width="28"/>
    <line x1="3960" y1="120" x2="3905" y2="185" stroke="#139a29" stroke-width="20"/>
    <g id="farBottom">
    <!-- dreapta jos -->
    <line x1="4060" y1="870" x2="3955" y2="765" stroke="#ffd60a" stroke-width="30"/>
    <line x1="4085" y1="725" x2="3965" y2="680" stroke="#139a29" stroke-width="28"/>
    <line x1="3960" y1="880" x2="3905" y2="815" stroke="#139a29" stroke-width="20"/>
    </g>
  </g>

  <!-- textul -->
  <g id="title"></g>
  <g id="pill"></g>
</svg>

<script>
(async function () {
  await document.fonts.load('100px "Paytone One"', "ȚȘĂ");
  await document.fonts.load('100px "Anton"');
  await document.fonts.ready;

  var NS = "http://www.w3.org/2000/svg";
  var q = new URLSearchParams(location.search);
  var right = q.get("sageata") === "dreapta";
  // Înălțimea bannerului (mm): 1000 implicit, sau ce vine din ?inaltime=
  var H = parseInt(q.get("inaltime") || "1000", 10), extra = H - 1000;
  ["html", "body", "svg"].forEach(function (s) { document.querySelector(s).style.height = H + "mm"; });
  // mărimea paginii PDF trebuie să urmeze și ea înălțimea aleasă
  var pageStyle = document.createElement("style");
  pageStyle.textContent = "@page { size: 4200mm " + H + "mm; margin: 0; }";
  document.head.appendChild(pageStyle);
  var svg = document.getElementById("b");
  svg.setAttribute("viewBox", "0 0 4200 " + H);
  document.getElementById("bg").setAttribute("height", H);
  document.getElementById("frame").setAttribute("height", H - 96);
  // liniuțele de jos coboară în colțurile de jos
  document.getElementById("leftBottom").setAttribute("transform", "translate(0 " + extra + ")");
  document.getElementById("farBottom").setAttribute("transform", "translate(0 " + extra + ")");
  // săgeata rămâne centrată pe înălțime și crește puțin (12% la 1,2 m), cu vârful pe loc
  var k = 1 + 0.6 * extra / 1000;
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  // Măsurare exactă a literelor (fără spațiul gol de deasupra / dedesubt)
  var ctx = document.createElement("canvas").getContext("2d");
  function metrics(text, family, size, spacing) {
    ctx.font = size + 'px "' + family + '"';
    ctx.letterSpacing = (spacing || 0) * size + "px";
    var m = ctx.measureText(text), h = ctx.measureText("H");
    return { width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight, left: m.actualBoundingBoxLeft, cap: h.actualBoundingBoxAscent };
  }
  // Mărimea fontului la care textul are exact lățimea dorită
  function fit(text, family, width, spacing) {
    return 1000 * width / metrics(text, family, 1000, spacing).width;
  }

  // Săgeata: contur verde închis, linie albă, interior în degrade
  var p = document.getElementById("arrowPath").getAttribute("d");
  var arrow = document.getElementById("arrow");
  arrow.innerHTML = "";
  el("path", { d: p, fill: "none", stroke: "#0b5a1c", "stroke-width": 64, "stroke-linejoin": "round" }, arrow);
  el("path", { d: p, fill: "none", stroke: "#ffffff", "stroke-width": 30, "stroke-linejoin": "round" }, arrow);
  el("path", { d: p, fill: "url(#arrowFill)", stroke: "#0b5a1c", "stroke-width": 4, "stroke-linejoin": "round" }, arrow);
  el("path", { d: "M300 500 L640 245 L640 360", fill: "none", stroke: "rgba(255,255,255,.35)", "stroke-width": 14, "stroke-linecap": "round", "stroke-linejoin": "round" }, arrow);
  arrow.setAttribute("transform", "translate(0 " + extra / 2 + ") translate(160 500) scale(" + k + ") translate(-160 -500)");

  // Zona pentru text (între săgeată și liniuțele din capăt)
  // în varianta „dreapta” zona e oglindită exact
  var start = 1110 + (k - 1) * (1010 - 160); // textul începe după săgeată
  var x0 = right ? 4200 - 3850 : start, x1 = right ? 4200 - start : 3850;
  if (right) {
    document.getElementById("arrowSide").setAttribute("transform", "translate(4200 0) scale(-1 1)");
    document.getElementById("farSide").setAttribute("transform", "translate(4200 0) scale(-1 1)");
  }
  var w = x1 - x0;

  // Rândul 1: „S-A DESCHIS PIAȚA” — verde, contur galben, umbră
  var t1 = "S-A DESCHIS PIAȚA", f1 = "Paytone One";
  var sp1 = 0.07; // spațiu între litere (din mărimea fontului), ca să nu se lipească literele cu contur
  var s1 = fit(t1, f1, w - 40, sp1), m1 = metrics(t1, f1, s1, sp1);
  var base1 = 160 + extra * 0.35 + m1.cap;
  var tx1 = x0 + 20 + m1.left;
  var title = document.getElementById("title");
  var common1 = { x: tx1, y: base1, "font-family": f1, "font-size": s1, "letter-spacing": s1 * sp1 };
  el("text", Object.assign({}, common1, { x: tx1 + 12, y: base1 + 14, fill: "#0b4a17", stroke: "#0b4a17", "stroke-width": 28, "stroke-linejoin": "round" }), title).textContent = t1;
  el("text", Object.assign({}, common1, { fill: "#ffd60a", stroke: "#ffd60a", "stroke-width": 28, "stroke-linejoin": "round" }), title).textContent = t1;
  el("text", Object.assign({}, common1, { fill: "#0e6420" }), title).textContent = t1;

  // Rândul 2: pastila verde cu „AGROALIMENTARĂ TINERETULUI”
  var pill = document.getElementById("pill");
  var py = base1 + 120, ph = (H - 120) - py, pr = 70; // loc pentru virgula de sub Ț
  el("rect", { x: x0 + 14, y: py + 18, width: w, height: ph, rx: pr, fill: "#0b4a17" }, pill);
  el("rect", { x: x0, y: py, width: w, height: ph, rx: pr, fill: "url(#pillFill)", stroke: "#ffd60a", "stroke-width": 22 }, pill);
  var t2 = "AGROALIMENTARĂ TINERETULUI", f2 = "Anton";
  var s2 = fit(t2, f2, w - 150), m2 = metrics(t2, f2, s2);
  // dacă textul ar fi prea înalt pentru pastilă, îl micșorăm după înălțime
  var maxCap = ph * 0.62;
  if (m2.cap > maxCap) { s2 = s2 * maxCap / m2.cap; m2 = metrics(t2, f2, s2); }
  el("text", { x: x0 + (w - m2.width) / 2 + m2.left, y: py + ph / 2 + m2.cap / 2, "font-family": f2, "font-size": s2, fill: "#ffffff" }, pill).textContent = t2;

  window.__gata = true;
})();
</script>
</body>
</html>
